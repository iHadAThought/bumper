# Example Bumper + nginx deploy (N30 OMNI offline stack).
# Copy to your host (e.g. /opt/bumper/docker-compose.yml) and set placeholders.
# REST remapped 18007→8007 when host :8007 is already in use.
# nginx stream SNI on :443: mq* → MQTTS 8883, else HTTPS.
services:
  bumper:
    image: ghcr.io/mvladislav/bumper:develop
    container_name: bumper
    restart: unless-stopped
    environment:
      TZ: UTC
      BUMPER_ANNOUNCE_IP: "BUMPER_VIP"   # LAN IP robots/HA should reach
      BUMPER_LISTEN: "0.0.0.0"
      DEBUG_BUMPER_LEVEL: INFO
      DEBUG_BUMPER_VERBOSE: "0"
      BUMPER_DATA: /bumper/data
      BUMPER_CERTS: /bumper/certs
    expose:
      - "443"
      - "8007"
      - "1883"
      - "8883"
      - "5223"
    volumes:
      - ./data:/bumper/data
      - ./certs:/bumper/certs
      - /etc/localtime:/etc/localtime:ro
    networks:
      - bumper

  nginx:
    image: nginx:1.27-alpine
    container_name: bumper-nginx
    restart: unless-stopped
    depends_on:
      - bumper
    ports:
      - "443:443"
      - "18007:8007"
      - "1883:1883"
      - "8883:8883"
      - "5223:5223"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - bumper

networks:
  bumper:
    driver: bridge
