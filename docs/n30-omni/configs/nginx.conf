# Bumper nginx stream: SNI-route :443 (mq* → MQTTS, else HTTPS).
# From DeebotUniverse/bumper configs/nginx.conf
error_log stderr;
pid /var/run/nginx.pid;

events { }

stream {
    resolver 127.0.0.11 ipv6=off;

    log_format upstreaminfo '$remote_addr [$time_local] '
        'SNI:"$ssl_preread_server_name" '
        'PORT:$server_port->$final_port';

    access_log /dev/stdout upstreaminfo;

    map $ssl_preread_server_name $final_port {
        ~^.*(mq).*\.eco(vacs|user)\.(net|com)$    8883;
        ~^.*(mq).*\.aliyuncs\.(com)$              8883;
        ~^.*eco(vacs|user)\.(net|com)$             443;
        ~^.*aliyuncs\.com$                         443;
        ~^.*aliyun\.com$                           443;
        default                                   8883;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass bumper:$final_port;
    }

    server {
        listen 8007;
        proxy_pass bumper:8007;
    }

    server {
        listen 1883;
        proxy_pass bumper:1883;
    }

    server {
        listen 8883;
        proxy_pass bumper:8883;
    }

    server {
        listen 5223;
        proxy_pass bumper:5223;
    }
}
