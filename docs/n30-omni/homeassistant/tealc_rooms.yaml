# Teal'c room labels + clean helpers (HA / Bumper only — no Ecovacs app).
# Install: copy to /config/packages/tealc_rooms.yaml (packages must be enabled),
# then Developer Tools → YAML → Reload Input texts + Reload Scripts + Reload Template entities
# (or restart HA once).
#
# How to learn which number is which room:
# 1. Open the Teal'c Map image (image.tealc_map) on a dashboard.
# 2. Run script.tealc_identify_segment with segment_id 0 — watch which area the bot targets.
# 3. Type that room name into input_text.tealc_room_0. Repeat for 1–4.
# 4. Pick a room from input_select.tealc_clean_target (dropdown) → script.tealc_clean_selected_room,
#    or use segment buttons / script.tealc_clean_segment by ID.

input_text:
  tealc_room_0:
    name: "Teal'c room 0"
    max: 40
    initial: ""
    icon: mdi:numeric-0-circle-outline
  tealc_room_1:
    name: "Teal'c room 1"
    max: 40
    initial: ""
    icon: mdi:numeric-1-circle-outline
  tealc_room_2:
    name: "Teal'c room 2"
    max: 40
    initial: ""
    icon: mdi:numeric-2-circle-outline
  tealc_room_3:
    name: "Teal'c room 3"
    max: 40
    initial: ""
    icon: mdi:numeric-3-circle-outline
  tealc_room_4:
    name: "Teal'c room 4"
    max: 40
    initial: ""
    icon: mdi:numeric-4-circle-outline

# Dropdown of currently labeled rooms (options synced by automation below).
input_select:
  tealc_clean_target:
    name: "Teal'c clean room"
    icon: mdi:map-marker
    options:
      - Living Room P1
      - Living Room P2
      - Kitchen/Hallway
      - Bedroom
      - Bathroom
    initial: Living Room P1

template:
  - sensor:
      - name: "Teal'c room labels"
        unique_id: tealc_room_labels
        icon: mdi:floor-plan
        state: >-
          {% set ns = namespace(n=0) %}
          {% for i in range(5) %}
            {% if states('input_text.tealc_room_' ~ i) | trim != '' %}
              {% set ns.n = ns.n + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.n }}/5 labeled
        attributes:
          segment_0: "{{ states('input_text.tealc_room_0') }}"
          segment_1: "{{ states('input_text.tealc_room_1') }}"
          segment_2: "{{ states('input_text.tealc_room_2') }}"
          segment_3: "{{ states('input_text.tealc_room_3') }}"
          segment_4: "{{ states('input_text.tealc_room_4') }}"
          # "kitchen:0, living:1" — for quick glance / automations
          by_name: >-
            {% set ns = namespace(parts=[]) %}
            {% for i in range(5) %}
              {% set n = states('input_text.tealc_room_' ~ i) | trim %}
              {% if n %}
                {% set ns.parts = ns.parts + [n ~ ':' ~ i] %}
              {% endif %}
            {% endfor %}
            {{ ns.parts | join(', ') }}

script:
  tealc_clean_segment:
    alias: "Teal'c clean segment"
    icon: mdi:robot-vacuum
    description: "Vacuum-only clean of one map segment (0–4). Use to identify rooms or clean by ID."
    mode: single
    fields:
      segment_id:
        name: Segment ID
        description: "Map segment from vacuum.tealc rooms.default (0–4)"
        required: true
        example: 0
        selector:
          number:
            min: 0
            max: 4
            mode: box
      cleanings:
        name: Cleanings
        required: false
        default: 1
        selector:
          number:
            min: 1
            max: 2
            mode: box
    sequence:
      - action: select.select_option
        target:
          entity_id: select.tealc_work_mode
        data:
          option: vacuum
      - action: vacuum.send_command
        target:
          entity_id: vacuum.tealc
        data:
          command: spot_area
          params:
            rooms:
              - "{{ segment_id | int }}"
            cleanings: "{{ cleanings | default(1) | int }}"

  tealc_identify_segment:
    alias: "Teal'c identify segment"
    icon: mdi:map-marker-question
    description: "Same as clean segment — watch image.tealc_map / the bot to learn which room that ID is, then fill input_text.tealc_room_N."
    mode: single
    fields:
      segment_id:
        name: Segment ID
        required: true
        example: 0
        selector:
          number:
            min: 0
            max: 4
            mode: box
    sequence:
      - action: script.tealc_clean_segment
        data:
          segment_id: "{{ segment_id | int }}"
          cleanings: 1

  tealc_clean_selected_room:
    alias: "Teal'c clean selected room"
    icon: mdi:robot-vacuum
    description: "Cleans the room chosen in input_select.tealc_clean_target (dashboard dropdown)."
    mode: single
    sequence:
      - action: script.tealc_clean_named_room
        data:
          room_name: "{{ states('input_select.tealc_clean_target') }}"

  tealc_clean_named_room:
    alias: "Teal'c clean named room"
    icon: mdi:form-textbox
    description: "Looks up a label from input_text.tealc_room_0…4 (case-insensitive) and runs spot_area."
    mode: single
    fields:
      room_name:
        name: Room name
        required: true
        example: Bedroom
        selector:
          select:
            options:
              - Living Room P1
              - Living Room P2
              - Kitchen/Hallway
              - Bedroom
              - Bathroom
            custom_value: true
    sequence:
      - variables:
          target_name: "{{ room_name | trim | lower }}"
          segment_id: >-
            {% set ns = namespace(id=none) %}
            {% for i in range(5) %}
              {% set n = states('input_text.tealc_room_' ~ i) | trim | lower %}
              {% if n and n == target_name %}
                {% set ns.id = i %}
              {% endif %}
            {% endfor %}
            {{ ns.id if ns.id is not none else -1 }}
      - if:
          - condition: template
            value_template: "{{ segment_id | int >= 0 }}"
        then:
          - action: script.tealc_clean_segment
            data:
              segment_id: "{{ segment_id | int }}"
              cleanings: 1
        else:
          - action: persistent_notification.create
            data:
              title: "Teal'c room not found"
              message: >-
                No input_text.tealc_room_* matches "{{ room_name }}".
                Label segments 0–4 first (run identify, then type names into the helpers).

automation:
  - id: tealc_sync_clean_target_options
    alias: "Teal'c sync clean-target dropdown"
    description: "Keep input_select.tealc_clean_target options = non-empty room labels."
    mode: single
    trigger:
      - platform: state
        entity_id:
          - input_text.tealc_room_0
          - input_text.tealc_room_1
          - input_text.tealc_room_2
          - input_text.tealc_room_3
          - input_text.tealc_room_4
      - platform: homeassistant
        event: start
    action:
      - variables:
          opts: >-
            {% set ns = namespace(o=[]) %}
            {% for i in range(5) %}
              {% set n = states('input_text.tealc_room_' ~ i) | trim %}
              {% if n %}
                {% set ns.o = ns.o + [n] %}
              {% endif %}
            {% endfor %}
            {{ ns.o }}
      - if:
          - condition: template
            value_template: "{{ opts | count > 0 }}"
        then:
          - action: input_select.set_options
            target:
              entity_id: input_select.tealc_clean_target
            data:
              options: "{{ opts }}"
