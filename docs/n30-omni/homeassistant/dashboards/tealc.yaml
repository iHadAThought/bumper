# Teal'c control + room labeling (HA / Bumper only).
# Registered via packages/tealc_dashboard.yaml → sidebar "Teal'c".
title: Teal'c
views:
  - title: Control
    path: control
    icon: mdi:robot-vacuum
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Map
            heading_style: title
          - type: markdown
            content: >
              Segment numbers are **not** drawn on this map (Bumper / no Ecovacs app).
              Tap **Identify 0–4** below, watch which room the bot enters, then type
              that name into the matching room helper.
          - type: picture-entity
            entity: image.tealc_map
            show_state: false
            show_name: false
            fit_mode: contain

      - type: grid
        cards:
          - type: heading
            heading: Vacuum
            heading_style: title
          - type: tile
            entity: vacuum.tealc
            features:
              - type: vacuum-commands
                commands:
                  - start_pause
                  - stop
                  - clean_spot
                  - locate
                  - return_home
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.tealc_battery
              - entity: select.tealc_work_mode
              - entity: select.tealc_active_map
              - entity: number.tealc_clean_count
              - entity: button.tealc_relocate

      - type: grid
        cards:
          - type: heading
            heading: Room labels (segment → name)
            heading_style: title
          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_text.tealc_room_0
                name: Room 0
              - entity: input_text.tealc_room_1
                name: Room 1
              - entity: input_text.tealc_room_2
                name: Room 2
              - entity: input_text.tealc_room_3
                name: Room 3
              - entity: input_text.tealc_room_4
                name: Room 4

      - type: grid
        cards:
          - type: heading
            heading: Identify (watch the map)
            heading_style: title
          - type: grid
            columns: 5
            square: false
            cards:
              - type: button
                name: "0"
                icon: mdi:numeric-0-circle-outline
                tap_action:
                  action: perform-action
                  perform_action: script.tealc_identify_segment
                  data:
                    segment_id: 0
              - type: button
                name: "1"
                icon: mdi:numeric-1-circle-outline
                tap_action:
                  action: perform-action
                  perform_action: script.tealc_identify_segment
                  data:
                    segment_id: 1
              - type: button
                name: "2"
                icon: mdi:numeric-2-circle-outline
                tap_action:
                  action: perform-action
                  perform_action: script.tealc_identify_segment
                  data:
                    segment_id: 2
              - type: button
                name: "3"
                icon: mdi:numeric-3-circle-outline
                tap_action:
                  action: perform-action
                  perform_action: script.tealc_identify_segment
                  data:
                    segment_id: 3
              - type: button
                name: "4"
                icon: mdi:numeric-4-circle-outline
                tap_action:
                  action: perform-action
                  perform_action: script.tealc_identify_segment
                  data:
                    segment_id: 4
          - type: heading
            heading: Clean by ID
            heading_style: title
          - type: grid
            columns: 5
            square: false
            cards:
              - type: button
                name: "0"
                icon: mdi:robot-vacuum
                tap_action:
                  action: perform-action
                  perform_action: script.tealc_clean_segment
                  data:
                    segment_id: 0
                    cleanings: 1
              - type: button
                name: "1"
                icon: mdi:robot-vacuum
                tap_action:
                  action: perform-action
                  perform_action: script.tealc_clean_segment
                  data:
                    segment_id: 1
                    cleanings: 1
              - type: button
                name: "2"
                icon: mdi:robot-vacuum
                tap_action:
                  action: perform-action
                  perform_action: script.tealc_clean_segment
                  data:
                    segment_id: 2
                    cleanings: 1
              - type: button
                name: "3"
                icon: mdi:robot-vacuum
                tap_action:
                  action: perform-action
                  perform_action: script.tealc_clean_segment
                  data:
                    segment_id: 3
                    cleanings: 1
              - type: button
                name: "4"
                icon: mdi:robot-vacuum
                tap_action:
                  action: perform-action
                  perform_action: script.tealc_clean_segment
                  data:
                    segment_id: 4
                    cleanings: 1
          - type: entities
            title: Clean by name
            show_header_toggle: false
            entities:
              - entity: input_select.tealc_clean_target
                name: Room
              - entity: script.tealc_clean_selected_room
                name: Clean selected room
                secondary_info: last-triggered

  - title: Status
    path: status
    icon: mdi:information-outline
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Cleaning
            heading_style: title
          - type: entities
            show_header_toggle: false
            entities:
              - sensor.tealc_area_cleaned
              - sensor.tealc_cleaning_duration
              - sensor.tealc_error
              - event.tealc_last_job
              - binary_sensor.tealc_mop_attached
      - type: grid
        cards:
          - type: heading
            heading: Lifetime / network
            heading_style: title
          - type: entities
            show_header_toggle: false
            entities:
              - sensor.tealc_total_cleanings
              - sensor.tealc_total_area_cleaned
              - sensor.tealc_total_cleaning_duration
              - sensor.tealc_filter_lifespan
              - sensor.tealc_main_brush_lifespan
              - sensor.tealc_side_brush_lifespan
              - sensor.tealc_wi_fi_ssid
              - sensor.tealc_wi_fi_rssi
              - sensor.tealc_ip_address
