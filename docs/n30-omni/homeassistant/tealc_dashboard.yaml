# Teal'c Lovelace sidebar dashboard.
# Lovelace dashboards are NOT loaded from packages — register in configuration.yaml:
#
# lovelace:
#   mode: storage
#   dashboards:
#     tealc-control:
#       mode: yaml
#       title: Teal'c
#       icon: mdi:robot-vacuum
#       show_in_sidebar: true
#       require_admin: false
#       filename: dashboards/tealc.yaml
#
# And copy dashboards/tealc.yaml → /config/dashboards/tealc.yaml, then restart HA.
# This package file is intentionally empty of lovelace: (kept as install notes only).
